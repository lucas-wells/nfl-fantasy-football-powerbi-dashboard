name: Temporary DeadEye Weather Audit

on:
  push:
    branches:
      - tmp-deadeye-weather-audit-20260808
    paths:
      - '.github/weather-audit/**'
      - '.github/workflows/tmp-weather-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/weather-audit/**'
      - '.github/workflows/tmp-weather-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp-deadeye-weather-audit-20260808

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy pandas numpy requests scipy statsmodels pyarrow tabulate

      - name: Run weather audit
        run: python .github/weather-audit/audit.py

      - name: Commit audit outputs to temporary branch
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather_audit_output/
          git commit -m "Add generated DeadEye weather audit outputs" || exit 0
          git push origin HEAD:tmp-deadeye-weather-audit-20260808

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadeye-weather-audit
          path: weather_audit_output/
          if-no-files-found: warn
          retention-days: 7
